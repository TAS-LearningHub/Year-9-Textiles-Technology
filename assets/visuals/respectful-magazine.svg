<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Respectful magazine evidence map</title><desc id="d">A claim is supported by a selected image, accurate caption, traceable source and explanation.</desc><rect width="1200" height="620" rx="38" fill="#fffaf7"/><g font-family="Segoe UI,Arial" fill="#3d2136" text-anchor="middle"><text x="600" y="70" font-size="42" font-weight="750">Make every claim traceable</text><circle cx="170" cy="305" r="105" fill="#f3cedd"/><text x="170" y="298" font-size="30" font-weight="750">Claim</text><text x="170" y="335" font-size="19">what you say</text><circle cx="385" cy="305" r="105" fill="#e8dded"/><text x="385" y="298" font-size="30" font-weight="750">Image</text><text x="385" y="335" font-size="19">selected evidence</text><circle cx="600" cy="305" r="105" fill="#dbe9da"/><text x="600" y="298" font-size="30" font-weight="750">Caption</text><text x="600" y="335" font-size="19">what it shows</text><circle cx="815" cy="305" r="105" fill="#efd184"/><text x="815" y="298" font-size="30" font-weight="750">Source</text><text x="815" y="335" font-size="19">where it came from</text><circle cx="1030" cy="305" r="105" fill="#e1c8d6"/><text x="1030" y="298" font-size="30" font-weight="750">Explain</text><text x="1030" y="335" font-size="19">why it matters</text><path d="M275 305h5m210 0h5m210 0h5m210 0h5" stroke="#6f2f5b" stroke-width="10" stroke-linecap="round"/><text x="600" y="525" font-size="24">Respect cultural knowledge, creative ownership and context. Attribution is part of the evidence.</text></g></svg>
