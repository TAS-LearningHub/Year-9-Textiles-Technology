<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Fashion history research chain</title><desc id="d">Historical conditions influence features that designers reinterpret for current markets.</desc><rect width="1200" height="500" rx="36" fill="#fbf4fa"/><g font-family="Segoe UI,Arial" text-anchor="middle"><text x="600" y="75" font-size="40" font-weight="700" fill="#402039">Explain influence, do not just list it</text><line x1="150" y1="260" x2="1050" y2="260" stroke="#6f2f5b" stroke-width="9"/><g fill="#9b426f"><circle cx="180" cy="260" r="20"/><circle cx="460" cy="260" r="20"/><circle cx="740" cy="260" r="20"/><circle cx="1020" cy="260" r="20"/></g><g font-size="25" font-weight="700" fill="#49223d"><text x="180" y="175">Context</text><text x="180" y="330" font-size="19" font-weight="400">society · technology · materials</text><text x="460" y="175">Era features</text><text x="460" y="330" font-size="19" font-weight="400">silhouette · detail · use</text><text x="740" y="175">Designer practice</text><text x="740" y="330" font-size="19" font-weight="400">inspiration · target market</text><text x="1020" y="175">Contemporary influence</text><text x="1020" y="330" font-size="19" font-weight="400">adapted for a new context</text></g><text x="600" y="425" font-size="23" fill="#66545f">Caption images, use APA references and respect cultural and intellectual property.</text></g></svg>
