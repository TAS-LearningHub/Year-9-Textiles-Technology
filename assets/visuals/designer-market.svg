<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Haute couture and ready-to-wear comparison</title><desc id="d">Two production systems are compared across fit, production, availability and target market.</desc><rect width="1200" height="620" rx="38" fill="#fffaf7"/><g font-family="Segoe UI,Arial" fill="#3d2136"><text x="600" y="70" text-anchor="middle" font-size="42" font-weight="750">A production system shapes the market</text><rect x="90" y="130" width="470" height="390" rx="34" fill="#f2cfdd"/><rect x="640" y="130" width="470" height="390" rx="34" fill="#dce9dc"/><text x="325" y="205" text-anchor="middle" font-size="34" font-weight="750">Haute couture</text><text x="875" y="205" text-anchor="middle" font-size="34" font-weight="750">Ready-to-wear</text><g font-size="23"><text x="145" y="275"><tspan font-weight="750">Fit</tspan><tspan x="145" dy="34">made for an individual client</tspan></text><text x="145" y="365"><tspan font-weight="750">Production</tspan><tspan x="145" dy="34">specialist, made-to-order work</tspan></text><text x="145" y="455"><tspan font-weight="750">Availability</tspan><tspan x="145" dy="34">highly limited</tspan></text><text x="695" y="275"><tspan font-weight="750">Fit</tspan><tspan x="695" dy="34">prepared in a size range</tspan></text><text x="695" y="365"><tspan font-weight="750">Production</tspan><tspan x="695" dy="34">repeated styles and quantities</tspan></text><text x="695" y="455"><tspan font-weight="750">Availability</tspan><tspan x="695" dy="34">broader retail access</tspan></text></g><text x="600" y="580" text-anchor="middle" font-size="24">Compare how the system changes price, access, promotion and the intended customer.</text></g></svg>
