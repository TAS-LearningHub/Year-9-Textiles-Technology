<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Safe textiles room learning cycle</title><desc id="d">A diagram connecting preparation, machine control, stopping and reflection.</desc><rect width="1200" height="500" rx="36" fill="#fff5f9"/><g font-family="Segoe UI,Arial" text-anchor="middle"><text x="600" y="72" font-size="42" font-weight="700" fill="#4d2340">Safe practical work is deliberate</text><g font-size="26" font-weight="700" fill="#49223d"><rect x="70" y="160" width="230" height="150" rx="26" fill="#f4cedd"/><text x="185" y="220">Prepare</text><text x="185" y="258" font-size="20" font-weight="400">clear · check · ask</text><rect x="345" y="160" width="230" height="150" rx="26" fill="#dcebdc"/><text x="460" y="220">Control</text><text x="460" y="258" font-size="20" font-weight="400">slow · accurate · alert</text><rect x="620" y="160" width="230" height="150" rx="26" fill="#f6dfaa"/><text x="735" y="220">Stop</text><text x="735" y="258" font-size="20" font-weight="400">jam · noise · uncertainty</text><rect x="895" y="160" width="230" height="150" rx="26" fill="#e6d8eb"/><text x="1010" y="220">Reflect</text><text x="1010" y="258" font-size="20" font-weight="400">function · finish · improve</text></g><path d="M300 235h45m230 0h45m230 0h45" stroke="#6f2f5b" stroke-width="8" stroke-linecap="round"/><text x="600" y="410" font-size="25" fill="#66545f">Teacher demonstration and local instructions control every practical step.</text></g></svg>
