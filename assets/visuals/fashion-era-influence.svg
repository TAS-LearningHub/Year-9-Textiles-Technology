<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">From fashion era to contemporary influence</title><desc id="d">A four-part evidence chain moves from historical context to era features, a contemporary example and an explained influence.</desc><rect width="1200" height="620" rx="38" fill="#fffaf7"/><g font-family="Segoe UI,Arial" fill="#3d2136"><text x="600" y="72" text-anchor="middle" font-size="40" font-weight="750">Explain the link between past and present</text><g text-anchor="middle"><rect x="60" y="155" width="240" height="290" rx="28" fill="#f3cedd"/><text x="180" y="220" font-size="28" font-weight="750">1. Context</text><text x="180" y="270" font-size="21"><tspan x="180">society</tspan><tspan x="180" dy="34">technology</tspan><tspan x="180" dy="34">materials</tspan><tspan x="180" dy="34">identity</tspan></text><rect x="340" y="155" width="240" height="290" rx="28" fill="#e8dded"/><text x="460" y="220" font-size="28" font-weight="750">2. Era feature</text><text x="460" y="270" font-size="21"><tspan x="460">silhouette</tspan><tspan x="460" dy="34">surface detail</tspan><tspan x="460" dy="34">construction</tspan><tspan x="460" dy="34">way of wearing</tspan></text><rect x="620" y="155" width="240" height="290" rx="28" fill="#dbe9da"/><text x="740" y="220" font-size="28" font-weight="750">3. New context</text><text x="740" y="270" font-size="21"><tspan x="740">new user</tspan><tspan x="740" dy="34">new purpose</tspan><tspan x="740" dy="34">new material</tspan><tspan x="740" dy="34">new market</tspan></text><rect x="900" y="155" width="240" height="290" rx="28" fill="#efd184"/><text x="1020" y="220" font-size="28" font-weight="750">4. Influence</text><text x="1020" y="270" font-size="21"><tspan x="1020">identify</tspan><tspan x="1020" dy="34">compare</tspan><tspan x="1020" dy="34">explain change</tspan><tspan x="1020" dy="34">support with evidence</tspan></text></g><path d="M300 300h40m240 0h40m240 0h40" stroke="#6f2f5b" stroke-width="9" stroke-linecap="round"/><text x="600" y="540" text-anchor="middle" font-size="24">Historical influence is an explained relationship—not a claim that two garments look similar.</text></g></svg>
