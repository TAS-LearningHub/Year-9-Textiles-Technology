<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Revise by retrieving and applying</title><desc id="desc">Link each course area to an example, then use the retrieval cycle.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Three areas · one learning cycle</tspan></text><g><rect x="35" y="135" width="250" height="145" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="160" y="183" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="160" dy="0">DESIGN</tspan></text><text x="160" y="227" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="160" dy="0">users · ideas</tspan><tspan x="160" dy="29">decisions + evidence</tspan></text></g><g><rect x="325" y="135" width="250" height="145" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="183" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="25" font-weight="800" fill="#45223d"><tspan x="450" dy="0">PROPERTIES +</tspan></text><text x="450" y="227" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="17" font-weight="500" fill="#45223d"><tspan x="450" dy="0">PERFORMANCE</tspan><tspan x="450" dy="29">fibre · yarn · structure</tspan></text></g><g><rect x="615" y="135" width="250" height="145" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="740" y="183" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="25" font-weight="800" fill="#45223d"><tspan x="740" dy="0">TEXTILES +</tspan></text><text x="740" y="227" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#45223d"><tspan x="740" dy="0">SOCIETY</tspan><tspan x="740" dy="29">history · culture · industry</tspan></text></g><g><rect x="220" y="350" width="130" height="100" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="285" y="392" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#45223d"><tspan x="285" dy="0">RETRIEVE</tspan></text></g><g><rect x="385" y="350" width="130" height="100" rx="24" fill="#f3d6e4" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="392" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="450" dy="0">CHECK</tspan></text></g><g><rect x="550" y="350" width="130" height="100" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="615" y="392" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="615" dy="0">CORRECT</tspan></text></g><g><rect x="385" y="485" width="130" height="75" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="517" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="450" dy="0">APPLY</tspan></text></g><g><line x1="350" y1="400" x2="375.2" y2="400.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="515" y1="400" x2="540.2" y2="400.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="615" y1="450" x2="526.7" y2="507.4" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="385" y1="515" x2="296.7" y2="457.6" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="315" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Use pyjamas, textile art or another teacher-approved scenario as evidence.</tspan></text></svg>