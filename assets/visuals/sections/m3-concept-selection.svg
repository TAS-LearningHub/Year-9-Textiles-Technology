<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Select a concept with evidence</title><desc id="desc">Compare two developed ideas against the same criteria before choosing a direction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Compare before you commit</tspan></text><g><rect x="45" y="155" width="235" height="240" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="162.5" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="162.5" dy="0">CONCEPT A</tspan></text><text x="162.5" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="162.5" dy="0">front + back</tspan><tspan x="162.5" dy="31">label features</tspan><tspan x="162.5" dy="31">materials</tspan><tspan x="162.5" dy="31">strengths + limits</tspan></text></g><g><rect x="620" y="155" width="235" height="240" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="737.5" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="737.5" dy="0">CONCEPT B</tspan></text><text x="737.5" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="737.5" dy="0">front + back</tspan><tspan x="737.5" dy="31">label features</tspan><tspan x="737.5" dy="31">materials</tspan><tspan x="737.5" dy="31">strengths + limits</tspan></text></g><g><rect x="330" y="145" width="240" height="260" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#45223d"><tspan x="450" dy="0">SAME CRITERIA</tspan></text><text x="450" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="450" dy="0">target user</tspan><tspan x="450" dy="31">function</tspan><tspan x="450" dy="31">aesthetics</tspan><tspan x="450" dy="31">available process</tspan><tspan x="450" dy="31">time + feasibility</tspan></text></g><g><line x1="280" y1="275" x2="316.0" y2="275.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="620" y1="275" x2="584.0" y2="275.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><rect x="285" y="450" width="330" height="90" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="488" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#45223d"><tspan x="450" dy="0">SELECT + JUSTIFY</tspan></text><text x="450" y="515" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="450" dy="0">explain the trade-off</tspan></text></g><g><line x1="450" y1="405" x2="450.0" y2="437.4" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>