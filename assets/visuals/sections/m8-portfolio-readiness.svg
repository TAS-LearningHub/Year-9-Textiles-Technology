<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Make the portfolio self-contained</title><desc id="desc">A reader should understand the evidence after it leaves the live website.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Readiness checklist</tspan></text><g><rect x="55" y="145" width="340" height="330" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="225" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="225" dy="0">CHECK THE EVIDENCE</tspan></text><text x="225" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="225" dy="0">✓ clear headings</tspan><tspan x="225" dy="31">✓ complete responses</tspan><tspan x="225" dy="31">✓ appropriate photos</tspan><tspan x="225" dy="31">✓ source references</tspan><tspan x="225" dy="31">✓ criteria + evaluation</tspan><tspan x="225" dy="31">✓ justified modification</tspan></text></g><g><rect x="505" y="145" width="340" height="150" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="675" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="675" dy="0">ADD CONTEXT</tspan></text><text x="675" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="675" dy="0">student details</tspan><tspan x="675" dy="23">task labels</tspan><tspan x="675" dy="23">what each item proves</tspan></text></g><g><rect x="505" y="340" width="340" height="135" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="675" y="388" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="675" dy="0">EXPORT + REVIEW</tspan></text><text x="675" y="432" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="675" dy="0">opens away from site</tspan><tspan x="675" dy="23">meaning remains clear</tspan></text></g><g><line x1="395" y1="310" x2="492.9" y2="252.1" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="675" y1="295" x2="675.0" y2="327.4" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="535" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#6f2f5b"><tspan x="450" dy="0">Website completion is practice evidence—not formal submission.</tspan></text></svg>