<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Safe room decisions</title><desc id="desc">Prepare the space, act deliberately, and stop and ask when equipment is uncertain.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Safe room decisions</tspan></text><text x="450" y="98" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#725e6b"><tspan x="450" dy="0">The safest action changes when a warning sign appears</tspan></text><g><rect x="55" y="155" width="235" height="250" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="172.5" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="172.5" dy="0">PREPARE</tspan></text><text x="172.5" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="172.5" dy="0">clear the area</tspan><tspan x="172.5" dy="31">control pins + leads</tspan><tspan x="172.5" dy="31">wait for authority</tspan></text></g><g><rect x="333" y="155" width="235" height="250" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="450.5" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="450.5" dy="0">ACT</tspan></text><text x="450.5" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="450.5" dy="0">focus on the task</tspan><tspan x="450.5" dy="31">handle sharps</tspan><tspan x="450.5" dy="31">keep clear of needle</tspan></text></g><g><rect x="610" y="155" width="235" height="250" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="727.5" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="727.5" dy="0">STOP + ASK</tspan></text><text x="727.5" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="727.5" dy="0">jam or odd noise</tspan><tspan x="727.5" dy="31">uncertain setup</tspan><tspan x="727.5" dy="31">accident or fault</tspan></text></g><g><line x1="290" y1="280" x2="321.0" y2="280.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="568" y1="280" x2="598.2" y2="280.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="490" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="24" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Teacher directions and local room rules control the practical activity.</tspan></text></svg>