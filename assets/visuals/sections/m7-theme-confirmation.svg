<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Use the controlling Textile Art source</title><desc id="desc">The higher-authority formal notice and the consistent course evidence resolve the theme as In the Garden for this 2024 source edition.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Check authority before designing</tspan></text><g><rect x="45" y="150" width="230" height="150" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="160" y="198" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#45223d"><tspan x="160" dy="0">FORMAL NOTICE</tspan></text><text x="160" y="242" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="160" dy="0">task title</tspan><tspan x="160" dy="31">criteria + marks</tspan></text></g><g><rect x="335" y="150" width="230" height="150" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="198" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="450" dy="0">COURSE SEQUENCE</tspan></text><text x="450" y="242" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="450" dy="0">term outline</tspan><tspan x="450" dy="31">assessment order</tspan></text></g><g><rect x="625" y="150" width="230" height="150" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="740" y="198" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="740" dy="0">EXAMINATION</tspan></text><text x="740" y="242" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="740" dy="0">matching theme</tspan><tspan x="740" dy="31">course context</tspan></text></g><g><line x1="160" y1="300" x2="337.2" y2="379.3" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="450" y1="300" x2="450.0" y2="371.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="740" y1="300" x2="562.8" y2="379.3" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><rect x="280" y="385" width="340" height="125" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="433" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="450" dy="0">IN THE GARDEN</tspan></text><text x="450" y="475" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="17" font-weight="500" fill="#45223d"><tspan x="450" dy="0">controls this 2024 source edition</tspan></text></g><text x="450" y="565" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Use any replacement notification formally issued for a later cohort.</tspan></text></svg>