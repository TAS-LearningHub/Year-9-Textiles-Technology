<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Transform inspiration</title><desc id="desc">Use sources to develop an original direction rather than copy a complete design.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Source → transform → original direction</tspan></text><g><rect x="38" y="185" width="150" height="190" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="113" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="113" dy="0">SOURCE</tspan></text><text x="113" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="113" dy="0">history</tspan><tspan x="113" dy="21">nature</tspan><tspan x="113" dy="21">culture*</tspan><tspan x="113" dy="21">objects</tspan><tspan x="113" dy="21">emotion</tspan></text></g><g><rect x="205" y="185" width="150" height="190" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="280" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="280" dy="0">NOTICE</tspan></text><text x="280" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="280" dy="0">line</tspan><tspan x="280" dy="21">shape</tspan><tspan x="280" dy="21">colour</tspan><tspan x="280" dy="21">texture</tspan><tspan x="280" dy="21">mood</tspan></text></g><g><rect x="372" y="185" width="150" height="190" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="447" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="24" font-weight="800" fill="#45223d"><tspan x="447" dy="0">TRANSFORM</tspan></text><text x="447" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="447" dy="0">select</tspan><tspan x="447" dy="24">simplify</tspan><tspan x="447" dy="24">repeat</tspan><tspan x="447" dy="24">change scale</tspan></text></g><g><rect x="539" y="185" width="150" height="190" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="614" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="614" dy="0">CURATE</tspan></text><text x="614" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="16" font-weight="500" fill="#45223d"><tspan x="614" dy="0">related images</tspan><tspan x="614" dy="24">swatches</tspan><tspan x="614" dy="24">words</tspan><tspan x="614" dy="24">source notes</tspan></text></g><g><rect x="706" y="185" width="156" height="190" rx="24" fill="#f3d6e4" stroke="#d9c6d1" stroke-width="2"/><text x="784" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="784" dy="0">DEVELOP</tspan></text><text x="784" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="784" dy="0">target user</tspan><tspan x="784" dy="31">clear mood</tspan><tspan x="784" dy="31">new ideas</tspan></text></g><g><line x1="188" y1="280" x2="200.2" y2="280.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="355" y1="280" x2="367.2" y2="280.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="522" y1="280" x2="534.2" y2="280.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="689" y1="280" x2="701.2" y2="280.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="470" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">*Use cultural knowledge and creative work respectfully and with context.</tspan></text></svg>