<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Make technique samples useful</title><desc id="desc">Samples become evidence when they record what happened and what the result could contribute.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Sample → notice → decide</tspan></text><g><rect x="45" y="170" width="190" height="245" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="140" y="218" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="140" dy="0">PROCESS</tspan></text><text x="140" y="262" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="140" dy="0">technique name</tspan><tspan x="140" dy="31">teacher-directed</tspan><tspan x="140" dy="31">safe method</tspan></text></g><g><rect x="255" y="170" width="190" height="245" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="350" y="218" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="350" dy="0">MATERIALS</tspan></text><text x="350" y="262" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="350" dy="0">base textile</tspan><tspan x="350" dy="31">added material</tspan><tspan x="350" dy="31">product used</tspan></text></g><g><rect x="465" y="170" width="190" height="245" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="560" y="218" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="560" dy="0">RESULT</tspan></text><text x="560" y="262" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="560" dy="0">line · texture</tspan><tspan x="560" dy="31">colour · form</tspan><tspan x="560" dy="31">control + finish</tspan></text></g><g><rect x="675" y="170" width="180" height="245" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="765" y="218" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#45223d"><tspan x="765" dy="0">POSSIBLE USE</tspan></text><text x="765" y="262" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="765" dy="0">where?</tspan><tspan x="765" dy="31">why?</tspan><tspan x="765" dy="31">what effect?</tspan></text></g><g><line x1="235" y1="292" x2="249.4" y2="292.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="445" y1="292" x2="459.4" y2="292.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="655" y1="292" x2="669.4" y2="292.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="500" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Exact equipment and product handling come from the teacher demonstration.</tspan></text></svg>