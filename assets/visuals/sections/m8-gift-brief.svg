<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Plan a teacher-approved textiles gift</title><desc id="desc">Free choice still needs a purposeful brief, approval and evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Recipient → need → criteria → approval</tspan></text><g><rect x="35" y="180" width="150" height="210" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="110" y="228" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="110" dy="0">RECIPIENT</tspan></text><text x="110" y="272" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="110" dy="0">who?</tspan></text></g><g><rect x="205" y="180" width="150" height="210" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="280" y="228" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="280" dy="0">NEED</tspan></text><text x="280" y="272" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="280" dy="0">why?</tspan></text></g><g><rect x="375" y="180" width="150" height="210" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="228" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="450" dy="0">CRITERIA</tspan></text><text x="450" y="272" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="17" font-weight="500" fill="#45223d"><tspan x="450" dy="0">3 clear tests</tspan></text></g><g><rect x="545" y="180" width="150" height="210" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="620" y="228" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="620" dy="0">TEACHER</tspan></text><text x="620" y="272" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#45223d"><tspan x="620" dy="0">approve idea</tspan><tspan x="620" dy="31">method + safety</tspan></text></g><g><rect x="715" y="180" width="150" height="210" rx="24" fill="#f3d6e4" stroke="#d9c6d1" stroke-width="2"/><text x="790" y="228" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="790" dy="0">EVIDENCE</tspan></text><text x="790" y="272" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="790" dy="0">design</tspan><tspan x="790" dy="31">make</tspan><tspan x="790" dy="31">evaluate</tspan></text></g><g><line x1="185" y1="285" x2="199.4" y2="285.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="355" y1="285" x2="369.4" y2="285.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="525" y1="285" x2="539.4" y2="285.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="695" y1="285" x2="709.4" y2="285.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="485" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#6f2f5b"><tspan x="450" dy="0">Teacher to confirm: product · materials · dimensions · process · assessment status</tspan></text></svg>