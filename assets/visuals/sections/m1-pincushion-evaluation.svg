<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Balanced pincushion evaluation</title><desc id="desc">Evaluate function and presentation, then record an achievement and a specific next improvement.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Use four evidence lenses</tspan></text><g><rect x="65" y="145" width="350" height="155" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="240" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="240" dy="0">FUNCTION</tspan></text><text x="240" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="240" dy="0">holds pins securely</tspan><tspan x="240" dy="31">stable + useful</tspan></text></g><g><rect x="485" y="145" width="350" height="155" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="660" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="660" dy="0">PRESENTATION</tspan></text><text x="660" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="660" dy="0">shape + seams</tspan><tspan x="660" dy="31">finish + consistency</tspan></text></g><g><rect x="65" y="340" width="350" height="155" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="240" y="388" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="240" dy="0">ACHIEVEMENT</tspan></text><text x="240" y="432" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="240" dy="0">what worked</tspan><tspan x="240" dy="31">evidence to repeat</tspan></text></g><g><rect x="485" y="340" width="350" height="155" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="660" y="388" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="660" dy="0">IMPROVEMENT</tspan></text><text x="660" y="432" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="660" dy="0">one precise change</tspan><tspan x="660" dy="31">linked to making</tspan></text></g><text x="450" y="555" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">A balanced evaluation uses evidence, not a single score.</tspan></text></svg>