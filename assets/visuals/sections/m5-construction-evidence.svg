<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Record construction evidence</title><desc id="desc">The website supports documentation; it does not replace the issued pattern or demonstration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Instruction → operation → check → evidence</tspan></text><g><rect x="40" y="185" width="180" height="210" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="130" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="29" font-weight="800" fill="#45223d"><tspan x="130" dy="0">AUTHORITY</tspan></text><text x="130" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="19" font-weight="500" fill="#45223d"><tspan x="130" dy="0">current pattern</tspan><tspan x="130" dy="31">teacher demo</tspan></text></g><g><rect x="260" y="185" width="180" height="210" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="350" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="29" font-weight="800" fill="#45223d"><tspan x="350" dy="0">OPERATION</tspan></text><text x="350" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="350" dy="0">name the step</tspan><tspan x="350" dy="31">follow locally</tspan></text></g><g><rect x="480" y="185" width="180" height="210" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="570" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="570" dy="0">QUALITY</tspan></text><text x="570" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="570" dy="0">what to check</tspan><tspan x="570" dy="31">compare result</tspan></text></g><g><rect x="700" y="185" width="160" height="210" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="780" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="29" font-weight="800" fill="#45223d"><tspan x="780" dy="0">EVIDENCE</tspan></text><text x="780" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="780" dy="0">sample</tspan><tspan x="780" dy="31">photo</tspan><tspan x="780" dy="31">note</tspan></text></g><g><line x1="220" y1="290" x2="248.8" y2="290.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="440" y1="290" x2="468.8" y2="290.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="660" y1="290" x2="688.8" y2="290.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="495" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#6f2f5b"><tspan x="450" dy="0">Do not invent machine settings, construction order or pattern quantities.</tspan></text></svg>