<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Plan resources and check costs</title><desc id="desc">Separate what is used to make the item from what is consumed in making it.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Equipment ≠ consumable resources</tspan></text><g><rect x="55" y="145" width="360" height="195" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="235" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="235" dy="0">EQUIPMENT</tspan></text><text x="235" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="235" dy="0">tools + machines</tspan><tspan x="235" dy="31">used to make the item</tspan><tspan x="235" dy="31">not consumed</tspan></text></g><g><rect x="485" y="145" width="360" height="195" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="665" y="193" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="665" dy="0">RESOURCES</tspan></text><text x="665" y="237" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="665" dy="0">fabric · thread · elastic</tspan><tspan x="665" dy="31">trims + other materials</tspan><tspan x="665" dy="31">consumed in making</tspan></text></g><g><rect x="90" y="395" width="720" height="115" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="443" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#45223d"><tspan x="450" dy="0">COSTING EVIDENCE</tspan></text><text x="450" y="478" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#45223d"><tspan x="450" dy="0">item + quantity + unit cost = total · use real receipts, labels or teacher figures</tspan></text></g><g><line x1="450" y1="340" x2="450.0" y2="381.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>