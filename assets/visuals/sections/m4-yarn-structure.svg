<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">From fibre form to yarn structure</title><desc id="desc">Fibre length and twist help determine how a yarn is built and behaves.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Fibre form changes yarn structure</tspan></text><g><rect x="45" y="160" width="180" height="135" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="135" y="208" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="135" dy="0">STAPLE</tspan></text><text x="135" y="252" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="135" dy="0">short lengths</tspan></text></g><g><rect x="45" y="340" width="180" height="135" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="135" y="388" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="135" dy="0">FILAMENT</tspan></text><text x="135" y="432" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="16" font-weight="500" fill="#45223d"><tspan x="135" dy="0">continuous lengths</tspan></text></g><g><rect x="330" y="225" width="240" height="175" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="273" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="450" dy="0">SPIN + TWIST</tspan></text><text x="450" y="317" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="450" dy="0">draw out fibres</tspan><tspan x="450" dy="29">add twist</tspan><tspan x="450" dy="29">control structure</tspan></text></g><g><rect x="675" y="125" width="180" height="115" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="765" y="173" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#45223d"><tspan x="765" dy="0">SINGLE</tspan></text></g><g><rect x="675" y="260" width="180" height="115" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="765" y="308" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="765" dy="0">PLY</tspan></text><text x="765" y="343" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="765" dy="0">2+ singles</tspan></text></g><g><rect x="675" y="395" width="180" height="115" rx="24" fill="#f3d6e4" stroke="#d9c6d1" stroke-width="2"/><text x="765" y="443" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="25" font-weight="800" fill="#45223d"><tspan x="765" dy="0">NOVELTY /</tspan></text><text x="765" y="478" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="765" dy="0">TEXTURED</tspan></text></g><g><line x1="225" y1="228" x2="317.7" y2="278.3" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="225" y1="407" x2="318.2" y2="347.5" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="570" y1="300" x2="665.7" y2="192.5" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="570" y1="310" x2="661.0" y2="316.1" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="570" y1="325" x2="666.1" y2="441.2" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>