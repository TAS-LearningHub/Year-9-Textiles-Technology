<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Confidence before speed</title><desc id="desc">Build sewing-machine confidence through control practice before a teacher-approved fabric test.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Confidence before speed</tspan></text><text x="450" y="98" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#725e6b"><tspan x="450" dy="0">Accuracy and control come before sewing quickly</tspan></text><g><rect x="55" y="190" width="155" height="175" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="132.5" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="36" font-weight="800" fill="#45223d"><tspan x="132.5" dy="0">1</tspan></text><text x="132.5" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="132.5" dy="0">Paper lines</tspan></text></g><g><rect x="267" y="190" width="155" height="175" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="344.5" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="36" font-weight="800" fill="#45223d"><tspan x="344.5" dy="0">2</tspan></text><text x="344.5" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="344.5" dy="0">Start + stop</tspan></text></g><g><rect x="479" y="190" width="155" height="175" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="556.5" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="36" font-weight="800" fill="#45223d"><tspan x="556.5" dy="0">3</tspan></text><text x="556.5" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="556.5" dy="0">Steer + turn</tspan></text></g><g><rect x="691" y="190" width="155" height="175" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="768.5" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="36" font-weight="800" fill="#45223d"><tspan x="768.5" dy="0">4</tspan></text><text x="768.5" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="768.5" dy="0">Fabric test</tspan></text></g><g><line x1="210" y1="278" x2="253.0" y2="278.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="422" y1="278" x2="465.0" y2="278.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="634" y1="278" x2="677.0" y2="278.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="455" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Power off for needle threading</tspan><tspan x="450" dy="31">Follow the exact classroom-machine demonstration</tspan></text></svg>