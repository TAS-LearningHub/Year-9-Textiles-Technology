<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Fibre classification</title><desc id="desc">Classify the fibre source before linking a property to an end use.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Where does the fibre come from?</tspan></text><g><rect x="335" y="120" width="230" height="90" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="158" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="25" font-weight="800" fill="#45223d"><tspan x="450" dy="0">TEXTILE FIBRES</tspan></text></g><g><line x1="400" y1="210" x2="247.9" y2="274.5" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="500" y1="210" x2="652.1" y2="274.5" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><rect x="80" y="280" width="310" height="105" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="235" y="324" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="235" dy="0">NATURAL</tspan></text><text x="235" y="356" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="18" font-weight="500" fill="#45223d"><tspan x="235" dy="0">from plant or animal sources</tspan></text></g><g><rect x="510" y="280" width="310" height="105" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="665" y="324" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="665" dy="0">MANUFACTURED</tspan></text>