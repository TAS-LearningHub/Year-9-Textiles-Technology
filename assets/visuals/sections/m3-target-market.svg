<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Turn a target market into design requirements</title><desc id="desc">User evidence becomes functional and aesthetic requirements for a nightwear design.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Design for a real user</tspan></text><g><rect x="65" y="185" width="220" height="230" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="175" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#45223d"><tspan x="175" dy="0">USER PROFILE</tspan></text><text x="175" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="175" dy="0">who will use it?</tspan><tspan x="175" dy="31">where + when?</tspan><tspan x="175" dy="31">preferences?</tspan></text></g><g><rect x="340" y="150" width="220" height="150" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="198" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="450" dy="0">FUNCTION</tspan></text><text x="450" y="242" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="18" font-weight="500" fill="#45223d"><tspan x="450" dy="0">comfort · movement</tspan><tspan x="450" dy="31">fit · climate · care</tspan></text></g><g><rect x="340" y="335" width="220" height="150" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="383" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="450" dy="0">EXPRESSION</tspan></text><text x="450" y="427" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="450" dy="0">colour · detail</tspan><tspan x="450" dy="31">personal style</tspan></text></g><g><rect x="615" y="185" width="220" height="230" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="725" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="28" font-weight="800" fill="#45223d"><tspan x="725" dy="0">REQUIREMENTS</tspan></text><text x="725" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="725" dy="0">specific</tspan><tspan x="725" dy="31">justified</tspan><tspan x="725" dy="31">achievable</tspan><tspan x="725" dy="31">teacher-approved</tspan></text></g><g><line x1="285" y1="300" x2="331.7" y2="236.3" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="285" y1="300" x2="333.7" y2="397.5" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="560" y1="225" x2="604.2" y2="261.1" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="560" y1="410" x2="607.1" y2="341.5" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g></svg>