<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Three ways to form fabric</title><desc id="desc">Compare the structure first, then use evidence to discuss performance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Woven · knitted · non-woven</tspan></text><g><rect x="45" y="155" width="250" height="315" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="170" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="170" dy="0">WOVEN</tspan></text><text x="170" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="170" dy="0">warp: length</tspan><tspan x="170" dy="31">weft: width</tspan><tspan x="170" dy="31">yarns interlace</tspan><tspan x="170" dy="31">plain · twill</tspan><tspan x="170" dy="31">satin / sateen</tspan></text></g><g><rect x="325" y="155" width="250" height="315" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="450" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="450" dy="0">KNITTED</tspan></text><text x="450" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="450" dy="0">interlocking loops</tspan><tspan x="450" dy="31">commonly stretchy</tspan><tspan x="450" dy="31">loop structure</tspan><tspan x="450" dy="31">responds to handling</tspan></text></g><g><rect x="605" y="155" width="250" height="315" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="730" y="203" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="730" dy="0">NON-WOVEN</tspan></text><text x="730" y="247" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="22" font-weight="500" fill="#45223d"><tspan x="730" dy="0">not woven</tspan><tspan x="730" dy="31">not knitted</tspan><tspan x="730" dy="31">bonded / formed</tspan><tspan x="730" dy="31">felt · interfacing</tspan><tspan x="730" dy="31">Solvy</tspan></text></g><text x="450" y="520" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Structure is evidence, not a guarantee.</tspan><tspan x="450" dy="26">Link it to fibre, finish and intended end use.</tspan></text></svg>