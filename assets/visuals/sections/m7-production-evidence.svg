<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Connect plan, making and evaluation</title><desc id="desc">Planned evidence and actual evidence should tell one coherent story.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Plan it · record it · judge it</tspan></text><g><rect x="28" y="185" width="142" height="240" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="99" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="99" dy="0">DRAWING</tspan></text><text x="99" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#45223d"><tspan x="99" dy="0">clear lines</tspan><tspan x="99" dy="31">real dimensions</tspan></text></g><g><rect x="205" y="185" width="142" height="240" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="276" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="276" dy="0">KEY</tspan></text><text x="276" y="277" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="15" font-weight="500" fill="#45223d"><tspan x="276" dy="0">technique labels</tspan><tspan x="276" dy="31">materials</tspan></text></g><g><rect x="382" y="185" width="142" height="240" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="453" y="233" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="800" fill="#45223d"><tspan x="453" dy="0">SEQUENCE</tspan></text><text x="453" y="277" 