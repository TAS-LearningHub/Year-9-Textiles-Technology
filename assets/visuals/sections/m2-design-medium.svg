<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Textiles as a design medium</title><desc id="desc">Design decisions connect focus area, user, purpose, materials, technology and end-use performance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 z" fill="#6f2f5b"/></marker></defs><rect width="900" height="600" rx="36" fill="#fffaf6"/><text x="450" y="58" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="38" font-weight="850" fill="#45223d"><tspan x="450" dy="0">Design is a connected system</tspan></text><g><rect x="40" y="190" width="150" height="185" rx="24" fill="#f2c7d9" stroke="#d9c6d1" stroke-width="2"/><text x="115" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="115" dy="0">FOCUS</tspan></text><text x="115" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="20" font-weight="500" fill="#45223d"><tspan x="115" dy="0">apparel</tspan><tspan x="115" dy="22">furnishings</tspan><tspan x="115" dy="22">costume</tspan><tspan x="115" dy="22">textile art</tspan><tspan x="115" dy="22">non-apparel</tspan></text></g><g><rect x="218" y="190" width="150" height="185" rx="24" fill="#d5e5d4" stroke="#d9c6d1" stroke-width="2"/><text x="293" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="293" dy="0">USER</tspan></text><text x="293" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="293" dy="0">need</tspan><tspan x="293" dy="31">purpose</tspan><tspan x="293" dy="31">context</tspan></text></g><g><rect x="396" y="190" width="150" height="185" rx="24" fill="#f6dda2" stroke="#d9c6d1" stroke-width="2"/><text x="471" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#45223d"><tspan x="471" dy="0">MATERIAL</tspan></text><text x="471" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="471" dy="0">fibre</tspan><tspan x="471" dy="31">yarn</tspan><tspan x="471" dy="31">fabric</tspan></text></g><g><rect x="574" y="190" width="150" height="185" rx="24" fill="#e5d7ec" stroke="#d9c6d1" stroke-width="2"/><text x="649" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="30" font-weight="800" fill="#45223d"><tspan x="649" dy="0">MAKE</tspan></text><text x="649" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="500" fill="#45223d"><tspan x="649" dy="0">tools</tspan><tspan x="649" dy="31">technology</tspan><tspan x="649" dy="31">process</tspan></text></g><g><rect x="752" y="190" width="108" height="185" rx="24" fill="#f3d6e4" stroke="#d9c6d1" stroke-width="2"/><text x="806" y="238" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="27" font-weight="800" fill="#45223d"><tspan x="806" dy="0">FIT</tspan></text><text x="806" y="282" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="21" font-weight="500" fill="#45223d"><tspan x="806" dy="0">end use</tspan></text></g><g><line x1="190" y1="282" x2="210.2" y2="282.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="368" y1="282" x2="388.2" y2="282.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="546" y1="282" x2="566.2" y2="282.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><g><line x1="724" y1="282" x2="744.2" y2="282.0" stroke="#6f2f5b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/></g><text x="450" y="480" text-anchor="middle" font-family="Aptos,Segoe UI,sans-serif" font-size="23" font-weight="650" fill="#725e6b"><tspan x="450" dy="0">Appearance matters, but the item must also perform for its intended use.</tspan></text></svg>