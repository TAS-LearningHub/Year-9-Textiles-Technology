<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Two-part textiles magazine evidence plan</title><desc id="d">The left page plans a fashion era report and the right page plans a designer interview, with shared image and reference requirements.</desc><rect width="1200" height="760" rx="40" fill="#f6edf2"/><g font-family="Segoe UI,Arial" fill="#342331"><text x="600" y="72" text-anchor="middle" font-size="42" font-weight="750">Two articles. One clear magazine system.</text><rect x="75" y="125" width="500" height="500" rx="28" fill="#fff" stroke="#d9c7d1" stroke-width="5"/><rect x="625" y="125" width="500" height="500" rx="28" fill="#fff" stroke="#d9c7d1" stroke-width="5"/><text x="325" y="190" text-anchor="middle" font-size="32" font-weight="750">Article 1 · Fashion era</text><text x="875" y="190" text-anchor="middle" font-size="32" font-weight="750">Article 2 · Designer interview</text><g font-size="22"><text x="125" y="255">□ Historical context</text><text x="125" y="305">□ Typical silhouette and details</text><text x="125" y="355">□ Wearers and ways of wearing</text><text x="125" y="405">□ Contemporary influence explained</text><text x="125" y="455">□ Captioned image evidence</text><text x="675" y="255">□ Background and location</text><text x="675" y="305">□ Focus area and recognisable style</text><text x="675" y="355">□ Inspiration and process</text><text x="675" y="405">□ Target market</text><text x="675" y="455">□ Question-and-response structure</text></g><rect x="125" y="505" width="400" height="70" rx="16" fill="#f3cedd"/><rect x="675" y="505" width="400" height="70" rx="16" fill="#dbe9da"/><text x="325" y="547" text-anchor="middle" font-size="21" font-weight="700">Claim → image → caption → source</text><text x="875" y="547" text-anchor="middle" font-size="21" font-weight="700">Question → evidence → explanation</text><text x="600" y="692" text-anchor="middle" font-size="24">Shared finish: readable hierarchy · accurate captions · APA references · respectful use of creative work</text></g></svg>
