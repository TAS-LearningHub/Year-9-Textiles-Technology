<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Textile art technique decision map</title><desc id="d">Mood board and samples lead to purposeful technique choices and an evaluated artwork.</desc><rect width="1200" height="500" rx="36" fill="#f7fbf4"/><g font-family="Segoe UI,Arial" text-anchor="middle"><text x="600" y="65" font-size="40" font-weight="700" fill="#402039">Technique follows design intention</text><g fill="#402039" font-size="24" font-weight="700"><rect x="70" y="145" width="220" height="210" rx="28" fill="#f4cedd"/><text x="180" y="220">Mood board</text><text x="180" y="258" font-size="18" font-weight="400">colour · imagery</text><text x="180" y="286" font-size="18" font-weight="400">texture · atmosphere</text><rect x="340" y="145" width="220" height="210" rx="28" fill="#e7d8ed"/><text x="450" y="220">Samples</text><text x="450" y="258" font-size="18" font-weight="400">process · material</text><text x="450" y="286" font-size="18" font-weight="400">result · possible use</text><rect x="610" y="145" width="220" height="210" rx="28" fill="#dcebdc"/><text x="720" y="220">Final plan</text><text x="720" y="258" font-size="18" font-weight="400">annotated techniques</text><text x="720" y="286" font-size="18" font-weight="400">production order</text><rect x="880" y="145" width="250" height="210" rx="28" fill="#f6dfaa"/><text x="1005" y="220">Evaluation</text><text x="1005" y="258" font-size="18" font-weight="400">criteria · evidence</text><text x="1005" y="286" font-size="18" font-weight="400">justified change</text></g><path d="M290 250h50m220 0h50m220 0h50" stroke="#6f2f5b" stroke-width="8" stroke-linecap="round"/><text x="600" y="430" font-size="23" fill="#66545f">Teacher confirmation controls the assessed theme, approved techniques and practical safety.</text></g></svg>
