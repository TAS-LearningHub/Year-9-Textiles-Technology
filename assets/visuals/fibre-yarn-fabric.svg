<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Fibre yarn fabric relationship</title><desc id="d">Fibres are assembled into yarns and yarns into fabric structures, which influence performance.</desc><rect width="1200" height="500" rx="36" fill="#f5fbf5"/><g font-family="Segoe UI,Arial" text-anchor="middle"><text x="600" y="70" font-size="40" font-weight="700" fill="#3d2940">Structure helps explain performance</text><g font-size="31" font-weight="700" fill="#402039"><circle cx="185" cy="235" r="115" fill="#f4cedd"/><text x="185" y="225">Fibre</text><text x="185" y="265" font-size="21" font-weight="400">small textile unit</text><circle cx="500" cy="235" r="115" fill="#e7d8ed"/><text x="500" y="225">Yarn</text><text x="500" y="265" font-size="21" font-weight="400">fibres assembled</text><circle cx="815" cy="235" r="115" fill="#dcebdc"/><text x="815" y="225">Fabric</text><text x="815" y="265" font-size="21" font-weight="400">woven · knitted · non-woven</text><circle cx="1080" cy="235" r="85" fill="#f6dfaa"/><text x="1080" y="225" font-size="27">End use</text><text x="1080" y="258" font-size="18" font-weight="400">fit for purpose</text></g><path d="M300 235h85m230 0h85m230 0h65" stroke="#6f2f5b" stroke-width="8" stroke-linecap="round"/><text x="600" y="430" font-size="25" fill="#66545f">Select properties and structures by linking evidence to the intended user and product.</text></g></svg>
