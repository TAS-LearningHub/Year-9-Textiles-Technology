<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Garment label and evaluation evidence</title><desc id="d">A garment label identifies core consumer information while evaluation checks function and quality.</desc><rect width="1200" height="500" rx="36" fill="#fff8f1"/><g font-family="Segoe UI,Arial" fill="#402039"><rect x="120" y="85" width="410" height="335" rx="26" fill="white" stroke="#9b426f" stroke-width="6"/><text x="325" y="145" text-anchor="middle" font-size="34" font-weight="700">Product label</text><text x="175" y="205" font-size="24">Brand</text><text x="175" y="250" font-size="24">Size</text><text x="175" y="295" font-size="24">Fibre content</text><text x="175" y="340" font-size="24">Country of manufacture</text><text x="175" y="385" font-size="24">Care information</text><text x="820" y="100" text-anchor="middle" font-size="35" font-weight="700">Evaluation evidence</text><g font-size="25"><rect x="650" y="145" width="340" height="58" rx="20" fill="#f4cedd"/><text x="820" y="182" text-anchor="middle">Function</text><rect x="650" y="220" width="340" height="58" rx="20" fill="#dcebdc"/><text x="820" y="257" text-anchor="middle">Aesthetics</text><rect x="650" y="295" width="340" height="58" rx="20" fill="#f6dfaa"/><text x="820" y="332" text-anchor="middle">Construction quality</text><rect x="650" y="370" width="340" height="58" rx="20" fill="#e7d8ed"/><text x="820" y="407" text-anchor="middle">Specific modification</text></g></g></svg>
